<div class="flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-100 p-8">
    <!-- Cabeçalho -->
    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold text-slate-900">Criar Conta</h2>
      <p class="text-slate-500 mt-2">Preencha os dados abaixo para começar</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-5">
      <!-- Nome Completo -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">Nome Completo</label>
        <input
          type="text"
          formControlName="fullName"
          class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none transition"
          [ngClass]="{
            'border-red-500':
              registerForm.get('fullName')?.touched && registerForm.get('fullName')?.invalid,
          }"
          placeholder="Ex: João Neto"
        />
      </div>

      <!-- E-mail -->
      <div>
        <label class="block text-sm font-semibold text-slate-700 mb-1">E-mail</label>
        <input
          type="email"
          formControlName="email"
          class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none transition"
          [ngClass]="{
            'border-red-500':
              registerForm.get('email')?.touched && registerForm.get('email')?.invalid,
          }"
          placeholder="exemplo@email.com"
        />
      </div>

      <!-- Senha -->
      <div class="relative">
        <label class="block text-sm font-semibold text-slate-700 mb-1">Senha</label>
        <input
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none transition"
          [ngClass]="{
            'border-red-500':
              registerForm.get('password')?.touched && registerForm.get('password')?.invalid,
          }"
          placeholder="Mínimo 6 caracteres"
        />
        <button
          type="button"
          (click)="togglePassword()"
          class="absolute right-3 top-9 text-slate-400 hover:text-slate-600"
        >
          @if (!showPassword()) {
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
              />
            </svg>
          } @else {
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.024 10.024 0 014.132-5.403m1.418-1.423A4.965 4.965 0 0112 7c1.32 0 2.533.515 3.434 1.352M12 12a3 3 0 01-3-3m3 3a3 3 0 003 3m0 0l3 3m-3-3l-3-3m-9-9l18 18"
              />
            </svg>
          }
        </button>
      </div>

      <!-- Confirmar Senha -->
      <div class="relative">
        <label class="block text-sm font-semibold text-slate-700 mb-1">Confirmar Senha</label>
        <input
          [type]="showPasswordConfirm() ? 'text' : 'password'"
          formControlName="confirmPassword"
          class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-blue-500 focus:outline-none transition"
          [ngClass]="{
            'border-red-500':
              (registerForm.get('confirmPassword')?.touched &&
                registerForm.get('confirmPassword')?.invalid) ||
              registerForm.hasError('passwordMismatch'),
          }"
          placeholder="Repita sua senha"
        />
        <button
          type="button"
          (click)="togglePasswordConfirm()"
          class="absolute right-3 top-9 text-slate-400 hover:text-slate-600"
        >
          @if (!showPasswordConfirm()) {
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"
              />
            </svg>
          } @else {
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-5 w-5"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a10.024 10.024 0 014.132-5.403m1.418-1.423A4.965 4.965 0 0112 7c1.32 0 2.533.515 3.434 1.352M12 12a3 3 0 01-3-3m3 3a3 3 0 003 3m0 0l3 3m-3-3l-3-3m-9-9l18 18"
              />
            </svg>
          }
        </button>
        @if (
          registerForm.hasError('passwordMismatch') && registerForm.get('confirmPassword')?.touched
        ) {
          <p class="text-xs text-red-500 mt-1">As senhas não coincidem.</p>
        }
      </div>

      <!-- Newsletter Checkbox -->
      <label class="flex items-center gap-3 cursor-pointer group">
        <div class="relative flex items-center">
          <input
            type="checkbox"
            formControlName="newsletter"
            class="peer h-5 w-5 cursor-pointer appearance-none rounded-md border border-slate-300 checked:bg-blue-600 checked:border-blue-600 transition-all"
          />
          <svg
            class="absolute h-3.5 w-3.5 text-white opacity-0 peer-checked:opacity-100 top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"
            xmlns="http://w3.org"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="4"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
          </svg>
        </div>
        <span class="text-sm text-slate-600 group-hover:text-slate-900 transition"
          >Quero receber notícias por e-mail</span
        >
      </label>

      <!-- Botão de Cadastro -->
      <button
        type="submit"
        [disabled]="registerForm.invalid || isLoading()"
        class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-blue-300 text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-200 transition active:scale-[0.98] mt-4 disabled:cursor-not-allowed disabled:opacity-60"
      >
        @if (isLoading()) {
          <span class="flex items-center justify-center gap-2">
            <svg
              class="h-5 w-5 animate-spin text-white"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"
              ></path>
            </svg>
            Cadastrando...
          </span>
        } @else {
          Finalizar Cadastro
        }
      </button>
    </form>
  </div>
</div>
