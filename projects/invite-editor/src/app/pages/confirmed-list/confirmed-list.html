<div class="w-[90%] max-w-7xl mx-auto p-6 bg-white rounded-3xl shadow-xl border border-slate-100">
  <!-- Header com Botão PDF -->
  <div class="flex items-start justify-between mb-8">
    <div>
      <h2 class="text-2xl font-bold text-slate-900">Lista de Convidados</h2>
      <p class="text-sm text-slate-500">{{ guests().length }} pessoas confirmadas</p>
    </div>

    <button
      (click)="exportToPDF()"
      [disabled]="guests().length === 0"
      class="flex items-center gap-2 px-4 py-2 bg-emerald-50 text-emerald-700 border border-emerald-100 rounded-xl font-semibold text-xs hover:bg-emerald-100 transition disabled:opacity-50 disabled:cursor-not-allowed"
    >
      <svg
        xmlns="http://w3.org"
        class="h-4 w-4"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"
        />
      </svg>
      Gerar PDF
    </button>
  </div>

  <!-- Campo para Adicionar Novo -->
  <div class="flex gap-2 mb-6">
    <div class="relative flex-1">
      <input
        type="text"
        [(ngModel)]="newGuestName"
        (keyup.enter)="addGuest()"
        placeholder="Nome do convidado..."
        class="w-full pl-4 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
      />
    </div>
    <button
      (click)="addGuest()"
      class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-xl font-semibold transition active:scale-95"
    >
      Confirmar
    </button>
  </div>

  <!-- Busca -->
  <div class="relative mb-4">
    <span class="absolute inset-y-0 left-3 flex items-center text-slate-400">
      <svg
        xmlns="http://w3.org"
        class="h-5 w-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
        />
      </svg>
    </span>
    <input
      type="text"
      [(ngModel)]="searchTerm"
      placeholder="Buscar na lista..."
      class="w-full pl-10 pr-4 py-2 text-sm rounded-lg bg-slate-50 border-transparent focus:bg-white focus:ring-1 focus:ring-slate-200 transition"
    />
  </div>

  <!-- Lista -->
  <div class="space-y-2 max-h-100 overflow-y-auto pr-2 custom-scrollbar">
    @for (guest of filteredGuests(); track guest.id) {
      <div
        class="group flex items-center justify-between p-4 rounded-2xl hover:bg-slate-50 border border-transparent hover:border-slate-100 transition"
      >
        <div class="flex items-center gap-3">
          <div
            class="h-10 w-10 rounded-full bg-linear-to-br from-blue-100 to-blue-200 flex items-center justify-center text-blue-700 font-bold text-sm"
          >
            {{ guest.name.charAt(0).toUpperCase() }}
          </div>
          <div>
            <p class="font-semibold text-slate-800">{{ guest.name }}</p>
            <p class="text-[10px] text-slate-400 uppercase tracking-tighter">
              Confirmado em {{ guest.date | date: 'short' }}
            </p>
          </div>
        </div>

        <button
          (click)="removeGuest(guest.id)"
          class="md:opacity-0 group-hover:opacity-100 p-3 -mr-2 text-slate-400 hover:text-red-500 transition-opacity"
        >
          <svg
            xmlns="http://w3.org"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-4v6m4-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
            />
          </svg>
        </button>
      </div>
    } @empty {
      <div class="py-12 text-center">
        <p class="text-slate-400">Nenhum convidado confirmado ainda.</p>
      </div>
    }
  </div>
</div>
