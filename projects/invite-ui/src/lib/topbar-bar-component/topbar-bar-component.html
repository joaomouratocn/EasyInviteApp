<header class="top-0 z-50 border-b border-slate-200 bg-white/80 backdrop-blur-xl">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
    <!-- LOGO -->
    <img
      [routerLink]="['/dashboard']"
      src="assets/shared/images/logo.png"
      alt="logo"
      class="h-10 sm:h-16 w-auto max-w-full object-contain"
    />
    @if (user$ | async; as u) {
      <div class="flex items-center gap-3">
        <div class="hidden sm:flex flex-col text-right">
          <p class="text-sm font-medium text-slate-800">{{ u.name }}</p>
          <p class="text-xs text-slate-500">{{ u.email }}</p>
        </div>

        <img
          [src]="u.pictureUrl ? u.pictureUrl : 'assets/shared/images/default-avatar.jpg'"
          alt="user-cover"
          class="h-7 w-7 md:h-9 md:w-9 rounded-full object-cover"
        />
        <button
          (click)="home()"
          class="rounded-xl bg-blue-50 px-4 py-2 text-sm font-semibold text-blue-600 border border-blue-200 hover:bg-blue-100 transition"
        >
          Inicio
        </button>
        <button
          (click)="logout()"
          class="rounded-xl bg-red-50 px-4 py-2 text-sm font-semibold text-red-600 border border-red-200 hover:bg-red-100 transition"
        >
          Sair
        </button>
      </div>
    }
  </div>
</header>
